services:
  # Server itself (CPP)
  run_server:
    build:
      context: ./server_cpp
      dockerfile: Dockerfile
    container_name: gmail_server
    stdin_open: true     # <-- keeps stdin open
    tty: true            # <-- allocates a pseudo-TTY
    volumes:
      - app_data:/usr/src/run_server  # <-- only the "data" folder is persisted between runs
    ports:
      - "42069:42069"
  # Server gtest
  gtest:
    build:
      context: ./server_cpp
      dockerfile: Dockerfile_test
    container_name: gmail_tests
    # Prevent the use of terminal input during test runs
    stdin_open: false
    tty: false
  # Client (Python)
  python_client:
    build:
      context: python_client
      dockerfile: Dockerfile
    container_name: python_client
    depends_on:
      - run_server
    stdin_open: true
    tty: true
    environment:
      - SERVER_HOST=run_server
      - SERVER_PORT=42069
      - PYTHON=/python_client
    # Change 'app' to desired server name here, '42069' to desired port (given as args)
    command: [ "python", "main.py", "run_server", "42069" ]
  # Client test runner (Python).
  test_client:
    build:
      context: .
      dockerfile: python_client/Dockerfile.tests
    container_name: client_tests
    depends_on:
      - run_server
    command: ["python","python_client/tests/test_client_unittest.py"]
  

volumes:
  app_data:   # <-- define the named volume